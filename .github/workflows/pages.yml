name: Deploy licensed PHB app to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Public distribution requires the publisher's own permission for the PHB content.
  # Pin the upstream input so an unrelated upstream edit cannot silently change a release.
  PHB_SOURCE_COMMIT: 63995fe26649fa49ac2cfa196e912f57a2693396
  VITE_BASE_PATH: /ttrpg-forge/

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - run: pnpm install --frozen-lockfile
      - name: Generate licensed PHB input
        run: python3 packs/phb-2024/scripts/build_phb.py --commit "$PHB_SOURCE_COMMIT"
      - run: pnpm check:phb
      - run: pnpm typecheck
      - run: pnpm test
      - name: Test Pages routing, PHB and offline mode
        run: pnpm e2e:pages --workers=2
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Publish verified app
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
